name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract ZIP if exists
      run: |
        if [ -f "BloodyShine_source_fixed.zip" ]; then
          echo "Extracting BloodyShine_source_fixed.zip..."
          unzip -q BloodyShine_source_fixed.zip
          cp -r BloodyShine/* .
          rm -rf BloodyShine
        elif [ -f "BloodyShine_final.zip" ]; then
          echo "Extracting BloodyShine_final.zip..."
          unzip -q BloodyShine_final.zip
          cp -r BloodyShine/* .
          rm -rf BloodyShine
        fi
        ls -la

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BloodyShine-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
