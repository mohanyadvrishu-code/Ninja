name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Find and Extract ZIP file
      run: |
        # Find ZIP file in repository
        ZIP_FILE=$(find . -name "*.zip" -type f | head -1)
        if [ -z "$ZIP_FILE" ]; then
          echo "No ZIP file found!"
          exit 1
        fi
        echo "Found ZIP: $ZIP_FILE"
        
        # Create extraction directory
        mkdir -p extracted
        
        # Extract ZIP
        unzip "$ZIP_FILE" -d extracted/
        
        # List extracted contents
        ls -la extracted/

    - name: Move extracted files to root
      run: |
        # Find the main project folder (BloodyShine or similar)
        PROJECT_FOLDER=$(find extracted -maxdepth 1 -type d ! -name "extracted" | head -1)
        echo "Project folder: $PROJECT_FOLDER"
        
        # Move all contents to repo root
        cp -r "$PROJECT_FOLDER"/* .
        
        # Verify key files exist
        ls -la

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: BloodyShine-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release (Optional)
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        release_name: Release v1.0.0-${{ github.run_number }}
        body: "APK build successful!"
        draft: false
        prerelease: false
