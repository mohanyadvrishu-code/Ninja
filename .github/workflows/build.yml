name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project directory
        id: projdir
        run: |
          DIR=$(find . -name "gradlew" | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $DIR"

      - name: Make gradlew executable
        run: chmod +x ${{ steps.projdir.outputs.dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.projdir.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Get APK path
        id: apk
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK found: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodyShine-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "BloodyShine v1.0.${{ github.run_number }}"
          generate_release_notes: false
          body: "Debug APK - Auto build #${{ github.run_number }}"
          files: ${{ steps.apk.outputs.path }}
