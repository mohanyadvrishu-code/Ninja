name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP: $ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Find project root
        id: projdir
        run: |
          DIR=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | grep -v "/build/" | head -1 | xargs -I{} dirname {})
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Project: $DIR"

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ${{ steps.projdir.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodyShine-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "BloodyShine v1.0.${{ github.run_number }}"
          generate_release_notes: false
          body: "Debug APK - Build #${{ github.run_number }}"
          files: ${{ steps.apk.outputs.path }}
